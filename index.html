<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lane Finder 🎳</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5EFE6;
            --warm-white: #FBF7F2;
            --amber: #D4842A;
            --amber-light: #E8A84E;
            --amber-dark: #A8621A;
            --brown: #3D2314;
            --brown-mid: #6B3E26;
            --lane-wood: #C4924A;
            --pin-white: #F0EAE0;
            --shadow: rgba(61, 35, 20, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--brown);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 80px,
                    rgba(196, 146, 74, 0.04) 80px,
                    rgba(196, 146, 74, 0.04) 82px
                );
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: relative;
            z-index: 10;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--brown);
            border-bottom: 4px solid var(--amber);
        }

        .logo { display: flex; align-items: center; gap: 14px; }

        .pin-cluster { display: flex; gap: 3px; align-items: flex-end; }

        .pin {
            width: 10px;
            background: var(--pin-white);
            border-radius: 40% 40% 20% 20% / 60% 60% 40% 40%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .pin-tall  { height: 26px; }
        .pin-mid   { height: 20px; }
        .pin-short { height: 15px; }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--cream);
            letter-spacing: 0.5px;
        }
        .logo-text span { color: var(--amber-light); }

        .header-sub {
            font-size: 12px;
            color: rgba(245, 239, 230, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .app {
            position: relative;
            z-index: 1;
            display: flex;
            height: calc(100vh - 70px);
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.5;
        }

        .side-panel.left-side  { border-right: 1px solid rgba(61,35,20,0.1); }
        .side-panel.right-side { border-left:  1px solid rgba(61,35,20,0.1); }
        .side-panel.loaded { opacity: 1; }

        .side-panel.active.left-side {
            background: linear-gradient(160deg, #FFF8F0 0%, #FFE8C8 100%);
            border-right-color: var(--amber);
        }
        .side-panel.active.right-side {
            background: linear-gradient(200deg, #FFF8F0 0%, #FFE8C8 100%);
            border-left-color: var(--amber);
        }

        .route-info {
            text-align: center;
            opacity: 0;
            transform: translateY(16px);
            transition: all 0.6s ease 0.2s;
            width: 100%;
        }
        .side-panel.loaded .route-info { opacity: 1; transform: translateY(0); }

        .route-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--amber-dark);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .route-name {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--brown);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .stat-item {
            background: white;
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 10px;
            box-shadow: 0 2px 12px var(--shadow);
        }
        .stat-label {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brown-mid);
            opacity: 0.6;
        }
        .stat-value { font-size: 20px; font-weight: 500; color: var(--brown); }

        .best-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--amber);
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 8px;
            animation: gentle-pulse 2.5s ease infinite;
            box-shadow: 0 4px 16px rgba(212,132,42,0.4);
        }

        @keyframes gentle-pulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(212,132,42,0.4); }
            50%       { box-shadow: 0 4px 28px rgba(212,132,42,0.65); }
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transition: opacity 0.4s ease;
        }
        .loading-state.visible { opacity: 1; }

        .loading-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brown-mid);
            opacity: 0.5;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(212,132,42,0.2);
            border-top-color: var(--amber);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .center-content {
            flex: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 30px;
            position: relative;
            z-index: 5;
        }

        .lane-lines {
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            pointer-events: none;
            opacity: 0.06;
        }
        .lane-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brown); }

        .cta-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .cta-eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--brown-mid);
            opacity: 0.45;
            font-weight: 500;
        }

        .bowling-button {
            background: var(--brown);
            color: var(--cream);
            border: none;
            padding: 18px 44px;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 28px rgba(61,35,20,0.25), 0 2px 6px rgba(61,35,20,0.15);
            position: relative;
            overflow: hidden;
        }
        .bowling-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .bowling-button:hover {
            background: var(--amber-dark);
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(61,35,20,0.3);
        }
        .bowling-button:active {
            transform: translateY(0);
            box-shadow: 0 3px 14px rgba(61,35,20,0.2);
        }

        .map-container {
            width: 100%;
            max-width: 520px;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 40px var(--shadow);
            border: 2px solid rgba(212,132,42,0.25);
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            position: relative;
            z-index: 2;
        }
        .map-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        #map { width: 100%; height: 100%; }

        .error-card {
            background: white;
            border-left: 4px solid #C0392B;
            border-radius: 8px;
            padding: 16px 20px;
            max-width: 240px;
        }
        .error-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            color: #C0392B;
            margin-bottom: 6px;
        }
        .error-card p { font-size: 13px; color: var(--brown-mid); line-height: 1.5; }

        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .app { flex-direction: column; height: auto; }
            .side-panel { min-height: 180px; border: none !important; }
            .center-content { order: -1; padding: 24px 20px; }
            .map-container { height: 220px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="pin-cluster">
                <div class="pin pin-short"></div>
                <div class="pin pin-mid"></div>
                <div class="pin pin-tall"></div>
                <div class="pin pin-mid"></div>
                <div class="pin pin-short"></div>
            </div>
            <div class="logo-text">Lane <span>Finder</span></div>
        </div>
        <div class="header-sub">Centreville Route Planner</div>
    </header>

    <div class="app">
        <div class="side-panel left-side" id="leftPanel">
            <div class="loading-state" id="leftLoading">
                <div class="spinner"></div>
                <div class="loading-label">Calculating</div>
            </div>
            <div class="route-info" id="leftRouteInfo"></div>
        </div>

        <div class="center-content">
            <div class="lane-lines">
                <div class="lane-line" style="left:18%"></div>
                <div class="lane-line" style="left:36%"></div>
                <div class="lane-line" style="left:54%"></div>
                <div class="lane-line" style="left:72%"></div>
                <div class="lane-line" style="left:90%"></div>
            </div>
            <div class="cta-wrap">
                <div class="cta-eyebrow">Find your fastest route</div>
                <button class="bowling-button" id="bowlingBtn">🎳 Let's Go Bowling</button>
            </div>
            <div class="map-container" id="mapContainer">
                <div id="map"></div>
            </div>
        </div>

        <div class="side-panel right-side" id="rightPanel">
            <div class="loading-state" id="rightLoading">
                <div class="spinner"></div>
                <div class="loading-label">Calculating</div>
            </div>
            <div class="route-info" id="rightRouteInfo"></div>
        </div>
    </div>

    <script>
        let directionsService, map, directionsRenderer;
        let isGoogleMapsLoaded = false;

        function initMap() {
            try {
                map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 38.8400, lng: -77.4288 },
                    zoom: 13,
                    styles: [
                        { featureType: "water",     elementType: "geometry",        stylers: [{ color: "#D4C4B0" }] },
                        { featureType: "landscape", elementType: "geometry",        stylers: [{ color: "#F5EFE6" }] },
                        { featureType: "road",      elementType: "geometry",        stylers: [{ color: "#C4924A" }] },
                        { featureType: "road",      elementType: "geometry.stroke", stylers: [{ color: "#A8621A" }] },
                        { featureType: "poi",       elementType: "geometry",        stylers: [{ color: "#E8D5BE" }] },
                        { featureType: "transit",                                   stylers: [{ visibility: "off" }] },
                        { featureType: "all",       elementType: "labels.text.fill",stylers: [{ color: "#3D2314" }] }
                    ],
                    disableDefaultUI: true,
                    zoomControl: true
                });

                directionsService = new google.maps.DirectionsService();
                directionsRenderer = new google.maps.DirectionsRenderer({
                    map,
                    suppressMarkers: true,
                    polylineOptions: { strokeColor: "#D4842A", strokeOpacity: 0.9, strokeWeight: 6 }
                });

                isGoogleMapsLoaded = true;
            } catch (e) {
                showError(e.message);
            }
        }

        window.initMap = initMap;

        function checkMapsLoaded() {
            if (typeof google !== 'undefined' && google.maps) {
                if (!isGoogleMapsLoaded) initMap();
                return true;
            }
            return false;
        }

        async function calculateRoutes() {
            if (!checkMapsLoaded()) {
                showError('Google Maps is still loading. Try again in a moment.');
                return;
            }

            const origin      = '12907 Swedes Street, Centreville, VA';
            const destination = 'Lucky Strike, Centreville, VA';
            const waypoint1   = '13814 Lee Hwy, Centreville, VA';
            const waypoint2   = 'Leland Road, Centreville, VA';

            showLoading();
            document.getElementById('mapContainer').classList.add('active');

            try {
                const [r1, r2] = await Promise.all([
                    calcRoute(origin, destination, waypoint1),
                    calcRoute(origin, destination, waypoint2)
                ]);

                const r1Best = parseDuration(r1.duration) <= parseDuration(r2.duration);
                await drawRoute(origin, destination, r1Best ? waypoint1 : waypoint2);

                displayResults(
                    { ...r1, name: 'Lee Highway', isBest: r1Best  },
                    { ...r2, name: 'Leland Road', isBest: !r1Best }
                );
            } catch (e) {
                showError('Could not calculate routes. Check your connection and try again.');
            }
        }

        function calcRoute(origin, destination, waypoint) {
            return new Promise((resolve, reject) => {
                directionsService.route({
                    origin, destination,
                    waypoints: [{ location: waypoint }],
                    travelMode: google.maps.TravelMode.DRIVING
                }, (result, status) => {
                    if (status === 'OK') {
                        const leg = result.routes[0].legs[0];
                        resolve({ distance: leg.distance.text, duration: leg.duration.text });
                    } else {
                        reject(new Error(status));
                    }
                });
            });
        }

        function drawRoute(origin, destination, waypoint) {
            return new Promise((resolve) => {
                directionsService.route({
                    origin, destination,
                    waypoints: [{ location: waypoint }],
                    travelMode: google.maps.TravelMode.DRIVING
                }, (result, status) => {
                    if (status === 'OK') {
                        directionsRenderer.setDirections(result);
                        addMarkers();
                    }
                    resolve();
                });
            });
        }

        function addMarkers() {
            [
                { pos: { lat: 38.8435, lng: -77.4360 }, color: '#3D2314' },
                { pos: { lat: 38.8375, lng: -77.4295 }, color: '#D4842A' }
            ].forEach(({ pos, color }) => {
                new google.maps.Marker({
                    position: pos, map,
                    icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: color, fillOpacity: 1, strokeColor: '#FBF7F2', strokeWeight: 2.5, scale: 9 }
                });
            });
        }

        function showLoading() {
            ['left', 'right'].forEach(s => {
                document.getElementById(`${s}Loading`).classList.add('visible');
                document.getElementById(`${s}Panel`).classList.remove('loaded', 'active');
            });
        }

        function displayResults(r1, r2) {
            ['left', 'right'].forEach(s => document.getElementById(`${s}Loading`).classList.remove('visible'));

            const render = (infoId, panelId, route) => {
                document.getElementById(infoId).innerHTML = `
                    <div class="route-label">Route via</div>
                    <div class="route-name">${route.name}</div>
                    <div class="stat-item">
                        <div class="stat-label">Travel Time</div>
                        <div class="stat-value">${route.duration}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Distance</div>
                        <div class="stat-value">${route.distance}</div>
                    </div>
                    ${route.isBest ? '<div class="best-badge">🏆 Fastest Route</div>' : ''}
                `;
                const panel = document.getElementById(panelId);
                panel.classList.add('loaded');
                if (route.isBest) panel.classList.add('active');
            };

            render('leftRouteInfo',  'leftPanel',  r1);
            render('rightRouteInfo', 'rightPanel', r2);
        }

        function showError(msg) {
            ['left', 'right'].forEach(s => document.getElementById(`${s}Loading`).classList.remove('visible'));
            document.getElementById('leftRouteInfo').innerHTML = `
                <div class="error-card">
                    <h3>⚠ Couldn't calculate</h3>
                    <p>${msg}</p>
                </div>`;
            document.getElementById('leftPanel').classList.add('loaded');
            document.getElementById('mapContainer').classList.remove('active');
        }

        function parseDuration(d) {
            let mins = 0;
            (d.toLowerCase().match(/(\d+)\s*(hour|hr|min)/g) || []).forEach(p => {
                const n = parseInt(p);
                mins += (p.includes('hour') || p.includes('hr')) ? n * 60 : n;
            });
            return mins;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const poll = setInterval(() => { if (checkMapsLoaded()) clearInterval(poll); }, 500);
            setTimeout(() => { clearInterval(poll); if (!isGoogleMapsLoaded) showError('Google Maps failed to load.'); }, 30000);

            document.getElementById('bowlingBtn').addEventListener('click', function () {
                this.style.transform = 'scale(0.96)';
                setTimeout(() => { this.style.transform = ''; }, 120);
                calculateRoutes();
            });
        });
    </script>

    <!-- Replace YOUR_API_KEY_HERE with your new restricted Google Maps API key -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDXLVv6s_u1YdKpqvc11gPyU2kSoASWWHw&callback=initMap"></script>
</body>
</html>
